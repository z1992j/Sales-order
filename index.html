<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>销售订单登记</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e40af">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="销售订单">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <form class="login-card" id="loginForm" onsubmit="submitLogin(event)">
    <h2>销售订单登记</h2>
    <p class="sub">请输入访问密码</p>
    <label for="loginPassword">密码</label>
    <input type="password" id="loginPassword" inputmode="numeric" autocomplete="current-password" placeholder="••••••" autofocus>
    <label class="login-remember"><input type="checkbox" id="loginRemember" checked> 在本设备保持登录</label>
    <button type="submit" class="btn btn-primary" id="loginBtn">进入系统</button>
    <div class="login-err" id="loginErr"></div>
  </form>
</div>

<div id="appRoot">

<div class="header">
  <div class="container">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <h1>销售订单登记</h1>
      <button class="btn-view" id="viewToggle" onclick="toggleView()" style="display:none"></button>
      <button class="btn-logout" onclick="logout()" title="退出登录">退出</button>
    </div>
    <p id="lastUpdate">数据加载中…</p>
  </div>
</div>

<div class="setup-banner" id="setupBanner"></div>
<div class="other-view-banner" id="otherViewBanner">你正在查看<b>非本人名下</b>的历史记录。这里的编辑、删除、改归属都会直接写入数据库；新增订单仍会记在自己名下。清理完点页头的「返回我的订单」。</div>
<div class="offline-banner" id="offlineBanner"></div>
<div class="trunc-banner" id="truncBanner"></div>
<div class="scope-line" id="scopeLine"></div>
<div class="stats" id="stats"></div>
<div class="trend-wrap" id="trendWrap"></div>
<div class="analysis-grid" id="analysisGrid"></div>

<div class="toolbar" id="toolbar">
  <!-- Row 1: 搜索 + 主操作 -->
  <div class="tb-row tb-row-main">
    <div class="search-box">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="搜索姓名、手机、城市、套餐…" oninput="renderAll()">
    </div>
    <div class="tb-actions">
      <button class="btn btn-smart" onclick="openSmartModal()">&#9889; 智能录入</button>
      <button class="btn btn-primary" onclick="openModal()">+ 新增订单</button>
    </div>
  </div>
  <!-- Row 2: 日常筛选 —— 月份 / 省份 / 城市 / 运营商 / 结佣状态，常驻不折叠 -->
  <div class="tb-row tb-row-filters">
    <select class="ctrl" id="filterMonth" onchange="renderAll()">
      <option value="">全部时间</option>
    </select>
    <select class="ctrl" id="filterProvince" onchange="onProvinceChange()">
      <option value="">全部省份</option>
    </select>
    <select class="ctrl" id="filterCity" onchange="renderAll()">
      <option value="">全部城市</option>
    </select>
    <select class="ctrl" id="filterCarrier" onchange="renderAll()">
      <option value="">全部运营商</option>
      <option value="联通">联通</option>
      <option value="移动">移动</option>
      <option value="电信">电信</option>
    </select>
    <span class="sep"></span>
    <button class="chip chip-unpaid" id="chipUnpaid" onclick="togglePaybackFilter('unpaid')">未结佣</button>
    <span class="chip-sub" id="agingChips">
      <button class="chip chip-sm" id="chipOver30" onclick="togglePaybackFilter('over30')">逾 30 天</button>
      <button class="chip chip-sm" id="chipOver60" onclick="togglePaybackFilter('over60')">逾 60 天</button>
    </span>
    <button class="chip" id="chipPaid" onclick="togglePaybackFilter('paid')">已结佣</button>
    <button class="btn-clear-filters" id="clearFilters" onclick="clearAllFilters()">
      ✕ 清除筛选<span id="filterCount"></span>
    </button>
  </div>
  <!-- Row 3: 排序 + 次级操作 -->
  <div class="tb-row tb-row-time">
    <select class="ctrl" id="sortBy" onchange="renderTable()">
      <option value="apply_desc">办理日期 ↓</option>
      <option value="apply_asc">办理日期 ↑</option>
      <option value="payback_desc">结佣日期 ↓</option>
      <option value="payback_asc">结佣日期 ↑</option>
      <option value="commission_desc">佣金 ↓</option>
      <option value="commission_asc">佣金 ↑</option>
      <option value="packageFee_desc">套餐费 ↓</option>
      <option value="packageFee_asc">套餐费 ↑</option>
      <option value="commissionRate_desc">佣金率 ↓</option>
      <option value="commissionRate_asc">佣金率 ↑</option>
    </select>
    <div class="tb-actions tb-actions-secondary">
      <button class="btn btn-ghost" onclick="exportCSV()">⬇ 导出 CSV</button>
      <button class="btn btn-ghost" onclick="triggerCSVImport()">⬆ 导入 CSV</button>
      <button class="btn btn-ghost" onclick="openLogViewer()">📋 操作日志</button>
    </div>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>序号</th>
        <th>办理日期</th>
        <th>结佣日期</th>
        <th>姓名</th>
        <th>手机号</th>
        <th>省份</th>
        <th>城市</th>
        <th>运营商</th>
        <th>套餐</th>
        <th>时限</th>
        <th class="text-right">安装费</th>
        <th class="text-right">套餐费</th>
        <th class="text-right">佣金</th>
        <th class="text-right">佣金率</th>
        <th>身份证号</th>
        <th>地址</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
    <tfoot id="totalRow"></tfoot>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">暂无订单数据</div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">新增订单</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>办理日期 *</label>
        <input type="date" id="f_applyDate">
      </div>
      <div class="form-group">
        <label>结佣日期</label>
        <input type="date" id="f_paybackDate">
      </div>
      <div class="form-group">
        <label>姓名 *</label>
        <input id="f_name" placeholder="客户姓名">
      </div>
      <div class="form-group">
        <label>手机号 *</label>
        <input id="f_phone" placeholder="11位手机号" maxlength="11">
      </div>
      <div class="form-group">
        <label>省份</label>
        <input id="f_province" placeholder="省份">
      </div>
      <div class="form-group">
        <label>城市</label>
        <input id="f_city" placeholder="城市">
      </div>
      <div class="form-group">
        <label>运营商</label>
        <select id="f_carrier">
          <option value="联通">联通</option>
          <option value="移动">移动</option>
          <option value="电信">电信</option>
        </select>
      </div>
      <div class="form-group">
        <label>套餐</label>
        <input type="text" id="f_package" list="packageSuggestions" placeholder="如 300m、1000M">
        <datalist id="packageSuggestions">
          <option value="100m"></option>
          <option value="200m"></option>
          <option value="300m"></option>
          <option value="500m"></option>
          <option value="1000m"></option>
        </datalist>
      </div>
      <div class="form-group">
        <label>时限</label>
        <select id="f_duration">
          <option value="6个月">6个月</option>
          <option value="1年" selected>1年</option>
          <option value="2年">2年</option>
          <option value="3年">3年</option>
        </select>
      </div>
      <div class="form-group">
        <label>安装费</label>
        <input type="number" id="f_installFee" min="0" placeholder="0">
      </div>
      <div class="form-group">
        <label>套餐费 *</label>
        <input type="number" id="f_packageFee" min="0" placeholder="0">
      </div>
      <div class="form-group">
        <label>佣金 *</label>
        <input type="number" id="f_commission" min="0" placeholder="0">
      </div>
      <div class="form-group">
        <label>佣金率(%)</label>
        <input type="number" id="f_commissionRate" min="0" max="100" step="1" placeholder="自动计算">
      </div>
      <div class="form-group span2">
        <label>身份证号</label>
        <input id="f_idCard" placeholder="18位身份证号" maxlength="18">
      </div>
      <div class="form-group span3">
        <label style="display:flex;justify-content:space-between;align-items:center">
          地址
          <button type="button" class="btn btn-sm btn-ghost" style="margin:0" onclick="fillLocationFromAddress()">从地址识别省市</button>
        </label>
        <textarea id="f_address" rows="2" placeholder="详细地址"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveOrder()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="smartOverlay" onclick="if(event.target===this)closeSmartModal()">
  <div class="modal">
    <h2>&#9889; 智能录入</h2>
    <p style="font-size:13px;color:#6b7280;margin-bottom:12px">粘贴下单信息，自动提取并填充表单</p>
    <textarea class="paste-area" id="smartText" placeholder="粘贴订单信息，例如：
姓名：苏杰
联系方式：17365306527
身份证：452133200206081817
办理地址（具体到房号）：江苏省无锡市滨湖区雪浪街道雪新苑7栋1302号
办理套餐：移动单宽带1000兆，480元一年，包安装"></textarea>
    <p class="parse-hint">标签后带括号备注、用空格代替冒号都能识别；带宽支持
      1000M / 1000兆 / 千兆，时限支持「一年」「两年」「18个月」「半年」。</p>
    <div class="extracted-fields" id="extractedPreview"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeSmartModal()">取消</button>
      <button class="btn btn-smart" onclick="parseAndFill()">提取并填充</button>
    </div>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)this.classList.remove('active')">
  <div class="detail-card" id="detailCard"></div>
</div>

<input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="handleCSVFile(this)">

<div class="modal-overlay" id="csvImportOverlay" onclick="if(event.target===this)closeCSVImport()">
  <div class="modal">
    <h2>CSV 批量导入</h2>
    <div id="csvImportContent"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeCSVImport()">取消</button>
      <button class="btn btn-primary" id="csvConfirmBtn" onclick="confirmCSVImport()" disabled>确认导入</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="logOverlay" onclick="if(event.target===this)closeLogViewer()">
  <div class="modal" style="max-width:720px">
    <h2 style="display:flex;justify-content:space-between;align-items:center">
      &#128203; 操作日志
      <button class="btn btn-cancel" onclick="closeLogViewer()" style="font-size:12px;padding:4px 12px">关闭</button>
    </h2>
    <div id="logContent" class="log-list">
      <div class="log-empty">加载中…</div>
    </div>
  </div>
</div>

</div><!-- /#appRoot -->

<script src="app.js"></script>
</body>
</html>
